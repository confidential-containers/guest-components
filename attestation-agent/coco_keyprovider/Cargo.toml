[package]
name = "coco_keyprovider"
version = "0.1.0"
authors = ["The Attestation Agent Authors"]
publish = false
edition = "2024"
license = "Apache-2.0"

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
ctr.workspace = true
daemonize = "0.5.0"
shadow-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3.32"
jwt-simple.workspace = true
protos = { path = "../../protos", default-features = false, features = [
    "grpc",
] }
rand.workspace = true
# The workspace pins reqwest with `default-features = false`, which leaves it with no TLS
# backend. Registering a KEK against a KBS served over TLS then fails before a request is
# sent, with "invalid URL, scheme is not http". Opt in to rustls for this crate, the way
# kbs_protocol and confidential-data-hub/kms already do, rather than widening the
# workspace pin. reqwest 0.13's `rustls` feature verifies through rustls-platform-verifier,
# which loads the platform trust store -- and honours SSL_CERT_FILE -- so a KBS fronted by
# a private CA needs no extra roots bundled into the binary.
reqwest = { workspace = true, features = ["rustls"] }
resource_uri.path = "../deps/resource_uri"
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tokio = { workspace = true, features = ["fs", "rt-multi-thread"] }
tonic.workspace = true
uuid = { workspace = true, features = ["fast-rng", "v4"] }

[build-dependencies]
shadow-rs.workspace = true

[dev-dependencies]
rstest.workspace = true

[features]

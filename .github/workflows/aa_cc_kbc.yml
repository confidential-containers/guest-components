name: attestation-agent cc_kbc tests

on:
  push:
    branches:
      - 'main'
    paths:
      - 'attestation-agent/kbc/cc_kbc/**'
      - 'attestation-agent/kbs_protocol/**'
      - 'attestation-agent/lib/**'
      - '.github/workflows/aa_cc_kbc.yml'
  pull_request:
    paths:
      - 'attestation-agent/kbc/cc_kbc/**'
      - 'attestation-agent/kbs_protocol/**'
      - 'attestation-agent/lib/**'
      - '.github/workflows/aa_cc_kbc.yml'
  create:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  cc_kbc_ci:
    permissions:
      contents: read
    if: github.event_name != 'push'
    name: Check
    defaults:
      run:
        working-directory: ./attestation-agent
    strategy:
      fail-fast: false
      matrix:
        instance:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - instance: ubuntu-24.04
            attester: snp-attester
          - instance: ubuntu-24.04
            attester: tdx-attester
          - instance: ubuntu-24.04
            attester: az-snp-vtpm-attester
          - instance: ubuntu-24.04
            attester: az-tdx-vtpm-attester
          - instance: ubuntu-24.04-arm
            attester: cca-attester
    runs-on: ${{ matrix.instance }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy

      - name: Update apt source list
        run: |
          sudo apt-get update

      - name: Install TPM dependencies
        run: |
          sudo apt-get install -y libtss2-dev
        if: matrix.instance == 'ubuntu-24.04'

      - name: Build and install with ${{ matrix.attester }} feature
        env:
          ATTESTER: ${{ matrix.attester }}
        run: |
          make ATTESTER=${ATTESTER} && make install

      - name: Run rust lint check
        env:
          ATTESTER: ${{ matrix.attester }}
        run: cargo clippy -p kbc --all-targets --features cc_kbc,${ATTESTER},rust-crypto -- -D warnings

      - name: Run cargo test
        env:
          ATTESTER: ${{ matrix.attester }}
        run: cargo test --features cc_kbc,${ATTESTER},rust-crypto -p kbc

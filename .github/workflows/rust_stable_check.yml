name: Run clippy checks for Rust stable

on:
  # run every Sunday
  schedule:
    - cron: '0 3 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clippy:
    name: Run clippy (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package:
          - api-server-rest
          - coco_keyprovider
          - crypto
          - resource_uri
          - kbs_protocol
          - confidential-data-hub
          - kms
          - image-rs
          - ocicrypt-rs
        include:
          - package: attestation-agent
            feature-parameters: "--no-default-features --features rust-crypto,kbs,all-attesters,bin,ttrpc"
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Update apt repositories
        run: sudo apt update

      - name: Install TPM dependencies
        run: sudo apt install -y libtss2-dev

      - name: Install dm-verity dependencies
        run: sudo apt install -y libdevmapper-dev

      - name: Install NVIDIA Attestation SDK
        if: contains(fromJSON('["attestation-agent", "kbs_protocol"]'), matrix.package)
        uses: $/.github/actions/install-nvat-sdk

      - name: Run rust lint checks (${{matrix.package}})
        env:
          PACKAGE: ${{matrix.package}}
          FEATURE_PARAMETERS: ${{matrix.feature-parameters}}
        run: cargo clippy -p ${PACKAGE} ${FEATURE_PARAMETERS} -- -D warnings

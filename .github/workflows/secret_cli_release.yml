name: Release secret CLI binary

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish secret CLI
    permissions:
      # Write only used for releases, when the binary is pushed to ghcr
      packages: write # required to publish OCI artifact to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        platform:
        - arch: x86_64
          libc: musl
          runner: ubuntu-24.04
        - arch: aarch64
          libc: musl
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    env:
      RUST_TARGET: ${{ matrix.platform.arch }}-unknown-linux-${{ matrix.platform.libc }}
      OCI_ARCH: ${{ matrix.platform.arch == 'x86_64' && 'amd64' || 'arm64' }}
      # Build all KMS providers
      CLI_FEATURES: cli,aliyun,aws,kbs
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      IS_PUBLISH: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Log in to the Container registry
      if: env.IS_PUBLISH == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up ORAS
      if: env.IS_PUBLISH == 'true'
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      with:
        version: 1.3.3

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag || github.ref }}
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        # The bundled AWS SDK crates require a newer rustc than the repo's
        # pinned toolchain (rust-toolchain.toml). Build the release binary on
        # stable so the aws feature compiles.
        toolchain: stable
        target: ${{ env.RUST_TARGET }}
        cache: false

    - name: Install dependencies
      env:
        LIBC: ${{ matrix.platform.libc }}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          protobuf-compiler libclang-dev cmake pkg-config
        if [ "${LIBC}" = "musl" ]; then
          sudo apt-get install -y --no-install-recommends musl-tools
        fi

    - name: Build secret CLI
      run: |
        cargo build \
          -p confidential-data-hub \
          --bin secret \
          --release \
          --target "${RUST_TARGET}" \
          --no-default-features \
          --features "${CLI_FEATURES}"

    - name: Publish with ORAS
      if: env.IS_PUBLISH == 'true'
      run: |
        image="${REGISTRY}/${IMAGE_NAME}/secret-cli"
        oras push \
          --artifact-type application/vnd.confidential-containers.secret-cli \
          --artifact-platform "linux/${OCI_ARCH}" \
          "${image}:${TAG}-${RUST_TARGET}" \
          "target/${RUST_TARGET}/release/secret"

  publish-manifest:
    name: Publish multi-arch manifest
    needs: build-and-publish
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      packages: write # required to push the multi-arch index to ghcr.io
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up ORAS
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      with:
        version: 1.3.3

    - name: Assemble and push multi-arch index
      run: |
        image="${REGISTRY}/${IMAGE_NAME}/secret-cli"
        oras manifest index create \
          --artifact-type application/vnd.confidential-containers.secret-cli \
          "${image}:${TAG},latest" \
          "${TAG}-x86_64-unknown-linux-musl" \
          "${TAG}-aarch64-unknown-linux-musl"

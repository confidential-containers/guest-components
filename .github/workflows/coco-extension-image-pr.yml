name: Publish the CoCo guest extension image from a pull request

# Lets consumers (e.g. kata-containers) test a pull request against real images.
#
# Adding the "publish-coco-extension" label publishes the artifacts that the
# "Build and publish the CoCo guest extension image" workflow built for the
# pull request's current head commit. They go to dedicated "-pr" packages,
# tagged "<head sha>-<variant>[-<arch>]" like the images published from main,
# so consumers only need to swap the image names and the version.
#
# The pull request code is never checked out or run here: it was built by the
# pull_request workflow with a read-only token, and this workflow only pushes
# the resulting artifacts. The label is removed afterwards, so every new head
# commit needs a maintainer to add it again.
#
# Each per-arch image is then attested the same way images from main are.
# pull_request builds cannot sign (a fork has no OIDC token), and consumers
# such as kata-containers verify the per-arch digest with --bundle-from-oci
# against this repository. The signing job only receives digests this
# workflow pushed; it does not run the pull request's code.
#
# A single comment on the pull request tracks the latest attempt: it is posted
# as soon as the label is seen and then updated with the image references, or
# with the reason nothing was published.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] PR code is never checked out, only its build artifacts are published.
    types:
    - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  REGISTRY: ghcr.io
  CONTAINER_IMAGE: ghcr.io/${{ github.repository }}/coco-extension-pr
  DISK_IMAGE: ghcr.io/${{ github.repository }}/coco-extension-disk-pr
  BUILD_WORKFLOW: coco-extension-image.yml
  COMMENT_MARKER: "<!-- coco-extension-image-pr -->"

jobs:
  announce:
    name: find the build and announce the publication
    if: ${{ github.event.label.name == 'publish-coco-extension' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # look up the pull_request build
      pull-requests: write # comment on the pull request
    outputs:
      comment_id: ${{ steps.comment.outputs.comment_id }}
      run_id: ${{ steps.build.outputs.run_id }}
      error: ${{ steps.build.outputs.error }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    # Does not fail when there is nothing to publish, so the reason reaches
    # the report job through this job's outputs.
    - name: Find the build of the pull request head
      id: build
      run: |
        run="$(gh run list --workflow "${BUILD_WORKFLOW}" --event pull_request \
          --commit "${HEAD_SHA}" --limit 1 --json databaseId,status,conclusion,url \
          --jq '.[0] // empty')"
        if [ -z "${run}" ]; then
          error="No ${BUILD_WORKFLOW} run found for ${HEAD_SHA}; add the label again once it has run."
        elif [ "$(jq -r .status <<< "${run}")" != "completed" ]; then
          error="The [${BUILD_WORKFLOW} run]($(jq -r .url <<< "${run}")) for ${HEAD_SHA} has not finished yet; add the label again once it has."
        elif [ "$(jq -r .conclusion <<< "${run}")" != "success" ]; then
          error="The [${BUILD_WORKFLOW} run]($(jq -r .url <<< "${run}")) for ${HEAD_SHA} ended with \"$(jq -r .conclusion <<< "${run}")\", so there is nothing to publish."
        fi
        if [ -n "${error:-}" ]; then
          echo "::error::${error}"
          echo "error=${error}" >> "${GITHUB_OUTPUT}"
        else
          echo "run_id=$(jq -r .databaseId <<< "${run}")" >> "${GITHUB_OUTPUT}"
        fi

    - name: Post or update the status comment
      id: comment
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        {
          echo "${COMMENT_MARKER}"
          echo "Publishing the CoCo guest extension images for ${HEAD_SHA} ([workflow run](${RUN_URL}))."
        } > body.md
        comment_id="$(gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${COMMENT_MARKER}\"))) | .id" \
          | tail -n 1)"
        if [ -n "${comment_id}" ]; then
          gh api --method PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" -F body=@body.md > /dev/null
        else
          comment_id="$(gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            -F body=@body.md --jq .id)"
        fi
        echo "comment_id=${comment_id}" >> "${GITHUB_OUTPUT}"

  publish:
    name: publish images for the pull request head
    needs: announce
    if: ${{ needs.announce.outputs.run_id != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # download the artifacts of the pull_request build
      packages: write # push the images to ghcr.io
    outputs:
      summary: ${{ steps.manifests.outputs.summary }}
      subjects: ${{ steps.images.outputs.subjects }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Download the build artifacts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_ID: ${{ needs.announce.outputs.run_id }}
      run: gh run download "${RUN_ID}" --pattern 'coco-extension-*' --dir artifacts

    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

    - name: Publish the per-arch images
      id: images
      run: |
        : > subjects.jsonl
        record() {
          case "$2" in
          sha256:*) ;;
          *)
            echo "::error::no digest for $1"
            exit 1
            ;;
          esac
          jq -nc --arg name "$1" --arg digest "$2" '{name:$name,digest:$digest}' >> subjects.jsonl
        }
        for dir in artifacts/coco-extension-*; do
          name="${dir#artifacts/coco-extension-}"
          variant="${name%-*}"
          arch="${name##*-}"
          tag="${HEAD_SHA}-${variant}-${arch}"

          loaded="$(docker load -i "${dir}/coco-extension-oci-${variant}-${arch}.tar" \
            | sed -n 's/^Loaded image: //p')"
          docker tag "${loaded}" "${CONTAINER_IMAGE}:${tag}"
          docker push "${CONTAINER_IMAGE}:${tag}"
          record "${CONTAINER_IMAGE}" \
            "$(docker inspect --format='{{index .RepoDigests 0}}' "${CONTAINER_IMAGE}:${tag}" | cut -d'@' -f2)"

          files=("kata-containers-coco-extension.img")
          cp "${dir}/kata-containers-coco-extension-${variant}-${arch}.img" \
            "${dir}/kata-containers-coco-extension.img"
          if [ -f "${dir}/root_hash_coco-extension-${variant}-${arch}.txt" ]; then
            cp "${dir}/root_hash_coco-extension-${variant}-${arch}.txt" \
              "${dir}/root_hash_coco-extension.txt"
            files+=("root_hash_coco-extension.txt")
          fi
          (cd "${dir}" && oras push "${DISK_IMAGE}:${tag}" \
            --artifact-type application/vnd.confidential-containers.coco-extension.disk \
            "${files[@]}")
          record "${DISK_IMAGE}" \
            "$(oras manifest fetch "${DISK_IMAGE}:${tag}" --descriptor | jq -r .digest)"
        done
        if [ ! -s subjects.jsonl ]; then
          echo "::error::published no images"
          exit 1
        fi
        echo "subjects=$(jq -c -s '.' subjects.jsonl)" >> "${GITHUB_OUTPUT}"

    - name: Publish the multi-arch manifests
      id: manifests
      run: |
        variants="$(find artifacts -mindepth 1 -maxdepth 1 -name 'coco-extension-*' \
          | sed 's|^artifacts/coco-extension-||; s|-[^-]*$||' | sort -u)"
        for variant in ${variants}; do
          for image in "${CONTAINER_IMAGE}" "${DISK_IMAGE}"; do
            reference="${image}:${HEAD_SHA}-${variant}"
            docker manifest create "${reference}" \
              --amend "${reference}-amd64" \
              --amend "${reference}-arm64" \
              --amend "${reference}-s390x"
            for arch in amd64 arm64 s390x; do
              docker manifest annotate --arch "${arch}" --os linux "${reference}" "${reference}-${arch}"
            done
            docker manifest push "${reference}"
          done
          {
            echo "### ${variant}"
            echo '```yaml'
            echo "version: \"${HEAD_SHA}\""
            echo "variant: \"${variant}\""
            echo "container_image: \"${CONTAINER_IMAGE}\""
            echo "extension_image: \"${DISK_IMAGE}\""
            echo '```'
          } >> summary.md
        done
        cat summary.md >> "${GITHUB_STEP_SUMMARY}"
        # The variant names come from the pull request's artifacts, so the
        # delimiter must not be guessable.
        delimiter="EOF_$(openssl rand -hex 16)"
        {
          echo "summary<<${delimiter}"
          cat summary.md
          echo "${delimiter}"
        } >> "${GITHUB_OUTPUT}"

  attest:
    name: record provenance
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # sign the provenance
      attestations: write # persist the attestation
      contents: read # actions/attest reads the repository
      packages: write # attach the attestation to the image
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(needs.publish.outputs.subjects) }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Attest ${{ matrix.subject.name }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ matrix.subject.name }}
        subject-digest: ${{ matrix.subject.digest }}
        push-to-registry: true

  report:
    name: report the result and remove the label
    needs: [announce, publish, attest]
    if: ${{ !cancelled() && github.event.label.name == 'publish-coco-extension' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write # comment on the pull request and remove the label
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Update the status comment
      env:
        COMMENT_ID: ${{ needs.announce.outputs.comment_id }}
        RESULT: ${{ needs.publish.result }}
        ATTEST: ${{ needs.attest.result }}
        ERROR: ${{ needs.announce.outputs.error }}
        SUMMARY: ${{ needs.publish.outputs.summary }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        {
          echo "${COMMENT_MARKER}"
          case "${RESULT}" in
          success)
            if [ "${ATTEST}" != "success" ]; then
              echo "Pushed the CoCo guest extension images for ${HEAD_SHA}, but recording their provenance failed ([workflow run](${RUN_URL}))."
            else
              echo "Published the CoCo guest extension images for ${HEAD_SHA} ([workflow run](${RUN_URL})):"
              echo
              echo "${SUMMARY}"
            fi
            ;;
          *)
            echo "Failed to publish the CoCo guest extension images for ${HEAD_SHA} ([workflow run](${RUN_URL}))."
            if [ -n "${ERROR}" ]; then
              echo
              echo "${ERROR}"
            fi
            ;;
          esac
        } > body.md
        if [ -n "${COMMENT_ID}" ]; then
          gh api --method PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -F body=@body.md > /dev/null
        else
          gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -F body=@body.md > /dev/null
        fi

    - name: Remove the label
      if: ${{ !cancelled() }}
      run: gh pr edit "${PR_NUMBER}" --remove-label publish-coco-extension

    - name: Fail when nothing was published
      if: ${{ needs.publish.result != 'success' || needs.attest.result != 'success' }}
      run: exit 1

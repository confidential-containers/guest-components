[package]
name = "kms"
version = "0.1.0"
authors = ["The Confidential Container Authors"]
publish = false
edition = "2024"
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aws-sdk-kms = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
base64.workspace = true
chrono = { workspace = true, optional = true }
const_format.workspace = true
hex = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
protos = { path = "../../protos", default-features = false, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
toml.workspace = true
tonic = { workspace = true, optional = true }
tracing.workspace = true
url = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
serial_test.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[build-dependencies]
anyhow.workspace = true
tonic-build.workspace = true

[features]
default = []

aliyun = [
    "chrono",
    "dep:openssl",
    "hex",
    "rand",
    "dep:reqwest",
    "sha2",
    "tonic",
    "url",
    "protos/grpc",
    "prost",
]
aws = ["aws-sdk-kms", "aws-sdk-secretsmanager"]

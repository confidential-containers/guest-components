[package]
name = "kms"
version = "0.1.0"
authors = ["The Confidential Container Authors"]
publish = false
edition = "2024"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
attestation-agent = { path = "../../attestation-agent/attestation-agent", default-features = false }
aws-sdk-kms = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
base64.workspace = true
chrono = { workspace = true, optional = true }
const_format.workspace = true
hex = { workspace = true, optional = true }
kbs_protocol = { path = "../../attestation-agent/kbs_protocol", default-features = false, features = [
    "passport",
    "aa_ttrpc",
    "openssl",
], optional = true }
openssl = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
protos = { path = "../../protos", default-features = false, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
resource_uri = { path = "../../attestation-agent/deps/resource_uri" }
sha2 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
toml.workspace = true
tonic = { workspace = true, optional = true }
tracing.workspace = true
url = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
serial_test.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[build-dependencies]
anyhow.workspace = true
tonic-build.workspace = true

[features]
default = ["aliyun", "kbs"]

aliyun = [
    "chrono",
    "dep:openssl",
    "hex",
    "rand",
    "reqwest/rustls",
    "sha2",
    "tonic",
    "url",
    "protos/grpc",
    "prost",
]
aws = ["aws-sdk-kms", "aws-sdk-secretsmanager"]
kbs = ["kbs_protocol"]

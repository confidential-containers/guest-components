[package]
name = "cc-op"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["The cc-op Authors"]
description = "Component for verifying sensitive commands"

[dependencies]
aes = "0.8"
aes-gcm = { version = "0.10.3", package = "aes-gcm" }
anyhow = "1.0"
bytes = "1.1.0"
byteorder = "1.5"
ctr = "0.9"
base64 = "0.22"
clap = { version = "4.3.10", features = ["derive"] }
hex = "0.4"
hpke = "0.11"
log = "0.4"
once_cell = "1.19"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
pem = "3.0"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hkdf = "0.12"
toml = "0.9.8"
tokio = { version = "1.46.1", features = ["full"] }
#x509-parser = "0.18.1"
x509-parser = "0.16"

futures = "0.3.30"
nix = "0.26.4"

[lib]
name = "cc_op"      # crate name used in Rust code
path = "src/lib.rs"
